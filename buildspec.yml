version: 0.2

phases:
  install:
    runtime-versions:
      java: corretto21
    commands:
      - echo "Installing project tools..."
      - mvn -v
      - java -version

  build:
    commands:
      - echo "Starting build on $(date)"
      - mvn clean package -DskipTests=true

  post_build:
    commands:
      - echo "Build completed on $(date)"

artifacts:
  files:
    - target/*.jar
  discard-paths: yes


