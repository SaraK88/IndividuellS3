version: 0.2

env:
  runtime-versions:
    java: corretto21

phases:
  build:
    commands:
      - "echo Starting build on $(date)"
      - mvn -v
      - java -version
      - mvn clean package -DskipTests=true
  post_build:
    commands:
      - "echo Build completed on $(date)"

artifacts:
  files:
    - target/*.jar
  discard-paths: yes




